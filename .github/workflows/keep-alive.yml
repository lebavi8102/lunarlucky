# Giám sát website: kiểm tra web + database định kỳ.
# Lỗi liên tục 3 lần → báo vào nhóm Telegram (nếu đã thêm secret TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID)
# và đánh dấu lần chạy thất bại → GitHub tự gửi email cho chủ repo.
name: keep-alive

# Repo private: mỗi lần chạy tính tối thiểu 1 phút trong 2.000 phút miễn phí/tháng.
# 30 phút/lần ≈ 1.440 lần/tháng (thực tế GitHub chạy thưa hơn) → vẫn trong mức miễn phí.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      test_telegram:
        description: 'Gửi tin thử vào nhóm Telegram'
        type: boolean
        default: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Kiểm tra website
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_TG: ${{ inputs.test_telegram }}
        run: |
          # Gửi tin Telegram; nhóm được nâng lên supergroup (bật Topics) thì tự dùng mã nhóm mới
          tg() {
            r=$(curl -s -m 20 "https://api.telegram.org/bot$TG_TOKEN/sendMessage" --data-urlencode "chat_id=$TG_CHAT" --data-urlencode "text=$1")
            new=$(echo "$r" | grep -o '"migrate_to_chat_id":-\?[0-9]*' | cut -d: -f2)
            if [ -n "$new" ]; then
              echo "Nhóm đã đổi mã thành $new — cập nhật secret TELEGRAM_CHAT_ID thành giá trị này"
              TG_CHAT=$new
              r=$(curl -s -m 20 "https://api.telegram.org/bot$TG_TOKEN/sendMessage" --data-urlencode "chat_id=$TG_CHAT" --data-urlencode "text=$1")
            fi
            echo "$r" | grep -q '"ok":true' && return 0
            echo "Telegram từ chối: $(echo "$r" | grep -o '"description":"[^"]*"')"
            return 1
          }
          if [ "$TEST_TG" = "true" ]; then
            [ -z "$TG_TOKEN" ] && echo "Thiếu secret TELEGRAM_BOT_TOKEN" && exit 1
            [ -z "$TG_CHAT" ] && echo "Thiếu secret TELEGRAM_CHAT_ID" && exit 1
            tg "✅ Thử báo lỗi: giám sát website Lunar Lucky đã kết nối nhóm. Khi web lỗi, tin cảnh báo sẽ gửi vào đây." && echo "Đã gửi tin thử" || exit 1
          fi
          check() {
            for i in 1 2 3; do
              code=$(curl -s -m 60 -o /dev/null -w "%{http_code}" "$1")
              echo "$code $1 (lần $i)"
              [ "$code" = "200" ] && return 0
              sleep 20
            done
            return 1
          }
          failed=""
          for url in "https://lunarlucky.onrender.com/healthz?db=1" "https://lunarlucky.onrender.com/"; do
            check "$url" || failed="$failed $url"
          done
          if [ -n "$failed" ]; then
            if [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ]; then
              tg "⚠️ Website Lunar Lucky đang lỗi:$failed — kiểm tra Render/Aiven." || true
            fi
            exit 1
          fi
